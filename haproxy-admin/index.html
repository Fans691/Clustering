<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAProxy - Administration</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --border: #d9dde3;
            --border-focus: #4a90d9;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --warning: #ca8a04;
            --warning-bg: #fef9c3;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { font-size: 1.3rem; font-weight: 700; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .status-badge.active { background: var(--success-bg); color: var(--success); }
        .status-badge.inactive { background: var(--error-bg); color: var(--error); }
        .status-badge.unknown { background: var(--warning-bg); color: var(--warning); }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .card-header {
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border);
            background: #f8f9fb;
        }

        .card-body { padding: 20px; }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field-grid .full { grid-column: 1 / -1; }

        .field { display: flex; flex-direction: column; gap: 5px; }

        .field label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .field input, .field select {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        .field input:focus, .field select:focus { border-color: var(--border-focus); }

        .field input[type="number"] { font-variant-numeric: tabular-nums; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 2px solid var(--border);
        }

        tbody td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 0.9rem;
            outline: none;
            background: transparent;
            transition: border-color 0.15s;
        }

        tbody input:focus { border-color: var(--border-focus); background: #f0f6ff; }

        tbody input[type="number"] {
            width: 90px;
            font-variant-numeric: tabular-nums;
        }

        .check-cell {
            text-align: center;
        }

        .check-cell input[type="checkbox"] {
            width: 18px; height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .delete-cell { text-align: center; width: 50px; }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
            line-height: 1;
        }

        .btn-delete:hover { color: var(--error); background: var(--error-bg); }

        .server-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
        }

        button {
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.88rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s;
        }

        button:hover { background: var(--bg); border-color: var(--accent); }

        button.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
        }

        button.primary:hover { background: var(--accent-hover); }

        button.danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        button.danger:hover { background: var(--danger-hover); }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .actions .spacer { flex: 1; }

        .toast-area {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            animation: toast-in 0.3s ease;
            pointer-events: auto;
            max-width: 400px;
        }

        .toast.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
        .toast.error { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
        .toast.info { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-section {
            display: none;
        }

        .preview-section.show {
            display: block;
        }

        .preview-section pre {
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 16px;
            border-radius: 6px;
            font-size: 0.82rem;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
            max-height: 400px;
        }

        @media (max-width: 600px) {
            .field-grid { grid-template-columns: 1fr; }
            .container { padding: 12px 8px; }
            header { padding: 12px 16px; }
            tbody input[type="number"] { width: 70px; }
        }
    </style>
</head>

<body>
    <header>
        <h1>HAProxy Admin</h1>
        <span class="status-badge unknown" id="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Chargement...</span>
        </span>
    </header>

    <div class="container">

        <!-- Configuration generale -->
        <div class="card">
            <div class="card-header">Configuration generale</div>
            <div class="card-body">
                <div class="field-grid">
                    <div class="field">
                        <label for="bind-port">Port d'ecoute (clients)</label>
                        <input type="number" id="bind-port" min="1" max="65535" value="8082">
                    </div>
                    <div class="field">
                        <label for="balance">Algorithme de repartition</label>
                        <select id="balance">
                            <option value="roundrobin">Round Robin</option>
                            <option value="leastconn">Least Connections</option>
                            <option value="source">Source IP (sticky)</option>
                            <option value="first">First available</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="health-check">Chemin du health check</label>
                        <input type="text" id="health-check" value="/a.html" placeholder="/a.html">
                    </div>
                </div>
            </div>
        </div>

        <!-- Serveurs backend -->
        <div class="card">
            <div class="card-header">Serveurs backend</div>
            <div class="card-body" style="padding: 0;">
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Adresse IP</th>
                            <th>Port</th>
                            <th style="text-align:center">Check</th>
                            <th style="width:50px"></th>
                        </tr>
                    </thead>
                    <tbody id="servers-body"></tbody>
                </table>
            </div>
            <div class="server-footer">
                <button type="button" id="btn-add-server">+ Ajouter un serveur</button>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="primary" id="btn-save">Sauvegarder</button>
            <button class="danger" id="btn-deploy">Deployer et Redemarrer</button>
            <div class="spacer"></div>
            <button id="btn-preview">Apercu du fichier</button>
            <button id="btn-reload">Recharger</button>
        </div>

        <!-- Apercu -->
        <div class="card preview-section" id="preview-card">
            <div class="card-header">Apercu de haproxy.cfg</div>
            <div class="card-body" style="padding:0;">
                <pre id="preview-content"></pre>
            </div>
        </div>

    </div>

    <div class="toast-area" id="toast-area"></div>

    <script>
        var serversBody = document.getElementById('servers-body');
        var bindPort = document.getElementById('bind-port');
        var balanceSelect = document.getElementById('balance');
        var healthCheck = document.getElementById('health-check');
        var previewCard = document.getElementById('preview-card');
        var previewContent = document.getElementById('preview-content');
        var toastArea = document.getElementById('toast-area');

        // --- Toast notifications ---
        function toast(message, type) {
            var el = document.createElement('div');
            el.className = 'toast ' + (type || 'info');
            el.textContent = message;
            toastArea.appendChild(el);
            setTimeout(function () { el.remove(); }, 4000);
        }

        // --- Server table ---
        function addServerRow(server) {
            var tr = document.createElement('tr');

            tr.innerHTML =
                '<td><input type="text" class="srv-name" value="' + esc(server.name) + '" placeholder="mon-serveur"></td>' +
                '<td><input type="text" class="srv-addr" value="' + esc(server.address) + '" placeholder="127.0.0.1"></td>' +
                '<td><input type="number" class="srv-port" min="1" max="65535" value="' + server.port + '"></td>' +
                '<td class="check-cell"><input type="checkbox" class="srv-check"' + (server.check ? ' checked' : '') + '></td>' +
                '<td class="delete-cell"><button type="button" class="btn-delete" title="Supprimer">X</button></td>';

            tr.querySelector('.btn-delete').addEventListener('click', function () {
                if (serversBody.rows.length <= 1) {
                    toast('Il faut au moins un serveur.', 'error');
                    return;
                }
                tr.remove();
            });

            serversBody.appendChild(tr);
        }

        function esc(str) {
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function getFormData() {
            var servers = [];
            var rows = serversBody.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                var name = row.querySelector('.srv-name').value.trim();
                var addr = row.querySelector('.srv-addr').value.trim();
                var port = row.querySelector('.srv-port').value;
                var check = row.querySelector('.srv-check').checked;
                if (!name) {
                    toast('Le nom du serveur ne peut pas etre vide (ligne ' + (i + 1) + ').', 'error');
                    return null;
                }
                if (!addr) {
                    toast('L\'adresse du serveur ne peut pas etre vide (ligne ' + (i + 1) + ').', 'error');
                    return null;
                }
                if (!port || port < 1 || port > 65535) {
                    toast('Port invalide pour "' + name + '".', 'error');
                    return null;
                }
                servers.push({ name: name, address: addr, port: parseInt(port), check: check });
            }
            return {
                bind_port: parseInt(bindPort.value) || 8082,
                balance: balanceSelect.value,
                health_check: healthCheck.value || '/a.html',
                servers: servers,
            };
        }

        function populateForm(data) {
            bindPort.value = data.bind_port || 8082;
            balanceSelect.value = data.balance || 'roundrobin';
            healthCheck.value = data.health_check || '/a.html';

            serversBody.innerHTML = '';
            var servers = data.servers || [];
            for (var i = 0; i < servers.length; i++) {
                addServerRow(servers[i]);
            }

            if (servers.length === 0) {
                addServerRow({ name: 'serveur1', address: '127.0.0.1', port: 80, check: true });
            }
        }

        // --- API calls ---
        function apiCall(method, url, body) {
            var opts = { method: method, headers: {} };
            if (body !== undefined) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            return fetch(url, opts).then(function (res) {
                return res.json().then(function (data) {
                    if (!res.ok && data.error) throw new Error(data.error);
                    return data;
                });
            });
        }

        function loadConfig() {
            apiCall('GET', '/api/parsed').then(function (data) {
                populateForm(data);
                toast('Configuration chargee.', 'success');
            }).catch(function (err) {
                toast('Erreur: ' + err.message, 'error');
            });
        }

        function saveConfig() {
            var data = getFormData();
            if (!data) return;
            apiCall('POST', '/api/parsed', data).then(function (res) {
                toast(res.message, 'success');
                if (res.preview) {
                    previewContent.textContent = res.preview;
                }
            }).catch(function (err) {
                toast('Erreur: ' + err.message, 'error');
            });
        }

        function deployAndRestart() {
            var data = getFormData();
            if (!data) return;
            if (!confirm('Sauvegarder, deployer et redemarrer HAProxy ?')) return;

            apiCall('POST', '/api/parsed', data).then(function (saveRes) {
                toast('Configuration sauvegardee.', 'success');
                if (saveRes.preview) {
                    previewContent.textContent = saveRes.preview;
                }
                return apiCall('POST', '/api/restart');
            }).then(function (res) {
                toast(res.message, 'success');
                setTimeout(checkStatus, 1500);
            }).catch(function (err) {
                toast('Erreur: ' + err.message, 'error');
            });
        }

        function togglePreview() {
            var showing = previewCard.classList.toggle('show');
            if (showing) {
                var data = getFormData();
                if (!data) return;
                apiCall('POST', '/api/parsed', data).then(function (res) {
                    if (res.preview) previewContent.textContent = res.preview;
                });
            }
        }

        function checkStatus() {
            apiCall('GET', '/api/status').then(function (data) {
                var badge = document.getElementById('status-badge');
                var text = document.getElementById('status-text');
                badge.className = 'status-badge ' + (data.active ? 'active' : 'inactive');
                text.textContent = data.active ? 'Actif' : 'Inactif';
            }).catch(function () {
                var badge = document.getElementById('status-badge');
                var text = document.getElementById('status-text');
                badge.className = 'status-badge unknown';
                text.textContent = 'Inconnu';
            });
        }

        // --- Events ---
        document.getElementById('btn-add-server').addEventListener('click', function () {
            var count = serversBody.rows.length + 1;
            addServerRow({ name: 'serveur' + count, address: '127.0.0.1', port: 80, check: true });
        });

        document.getElementById('btn-save').addEventListener('click', saveConfig);
        document.getElementById('btn-deploy').addEventListener('click', deployAndRestart);
        document.getElementById('btn-preview').addEventListener('click', togglePreview);
        document.getElementById('btn-reload').addEventListener('click', loadConfig);

        // --- Init ---
        loadConfig();
        checkStatus();
        setInterval(checkStatus, 30000);
    </script>
</body>

</html>
